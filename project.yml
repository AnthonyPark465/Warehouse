name: Warehouse
# Per-machine overrides live in project.local.yml (gitignored; regen.sh creates
# an empty one). Put your signing team there so it survives regeneration:
#   targets:
#     WarehouseApp:
#       settings:
#         base:
#           DEVELOPMENT_TEAM: YOURTEAMID
include:
  - project.defaults.yml
  - project.local.yml

options:
  bundleIdPrefix: com.tetris
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # Pinned for reproducible builds; newer 11.x/12.x need Xcode 16+ (now the
    # project minimum), so bump deliberately and re-run the test suite.
    exactVersion: 11.6.0

targets:
  WarehouseApp:
    type: application
    platform: iOS
    # GoogleService-Info.plist is picked up automatically by this glob once
    # added to WarehouseApp/ (then rerun scripts/regen.sh).
    sources:
      - path: WarehouseApp
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is used to scan product barcodes, take product photos, and measure objects for storage."
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
      configs:
        # Development builds expose Documents in the Files app so validation
        # scan recordings (Documents/ScanRecordings) can be copied to a Mac.
        Debug:
          INFOPLIST_KEY_UIFileSharingEnabled: YES
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

  WarehouseAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WarehouseAppTests]
    dependencies:
      - target: WarehouseApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10

schemes:
  WarehouseApp:
    build:
      targets:
        WarehouseApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WarehouseAppTests
